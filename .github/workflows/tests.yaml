name: Tests

on:
  push:
    paths:
      - "wallbox-dolibarr/**"
      - ".github/workflows/tests.yaml"
  pull_request:
    paths:
      - "wallbox-dolibarr/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallbox-dolibarr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
