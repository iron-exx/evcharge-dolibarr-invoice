name: "ExpenseCharge"
description: "ExpenseCharge — Ladevorgänge. Spesen. Abgerechnet."
version: "2.0.0"
slug: "wallbox-dolibarr"
init: false

image: "ghcr.io/iron-exx/{arch}-addon-expensecharge"

arch:
  - aarch64
  - amd64

ingress: true
ingress_port: 8099
homeassistant_api: true

ports:
  8099/tcp: null
  9000/tcp: null
ports_description:
  9000/tcp: "OCPP-Zentralserver (nur bei session_source: ocpp) — hier den Host-Port eintragen, z.B. 9000"

options:
  log_level: "INFO"

  # Multi-Wallbox Konfiguration
  wallboxes:
    - id: "alfen_eve"
      name: "Alfen Eve (Hauptwandbox)"
      enabled: true
      default: true

  # Fallback für Abwärtskompatibilität
  wallbox_id: "alfen_eve"

  # RFID Whitelist
  rfid_whitelist:
    - "EFCD083E"

  # ── Betriebsart ────────────────────────────────────────────────────────
  # "ha_sensors" → Ladevorgänge aus Home-Assistant-Sensoren (bisheriges Verhalten)
  # "ocpp"       → Addon ist selbst OCPP-1.6J-Zentralserver, Wallbox verbindet
  #                sich direkt (ws://<HA-IP>:<Port>/<Charge-Point-ID>)
  session_source: "ha_sensors"
  ocpp_charge_points: []
  ocpp_heartbeat_interval: 300
  ocpp_apply_recommended_config: false

  # ── Wallbox-Profil ─────────────────────────────────────────────────────
  # "alfen_eve"  → bewährtes Alfen-Verhalten, Auth-/Zustand-Logik fest verdrahtet
  # "custom"     → Auth-Modus und Zustand-Erkennung frei konfigurierbar
  #                (andere Hersteller, vorgeschalteter Zähler wie Shelly EM,
  #                Wallbox ganz ohne eigenen Zähler, o.ä.)
  wallbox_profile: "alfen_eve"

  # HA-Sensoren der Wallbox (Alfen Eve Vorgabe — bei anderer Wallbox/Profil anpassen)
  sensor_rfid: "sensor.alfen_eve_tag_socket_1"
  sensor_energy: "sensor.alfen_eve_meter_reading_socket_1"
  sensor_state: "sensor.alfen_eve_main_state_socket_1"

  # ── Nur wirksam bei wallbox_profile: "custom" ──────────────────────────
  # Autorisierung:
  #   tag_hold   — Tag liegt an, solange geladen wird (Alfen-Standard)
  #   tag_pulse  — Tag-Event nur kurz sichtbar, Ende kommt aus state_mode
  #   tag_toggle — 1. autorisierter Tap = Start, 2. Tap = Ende
  #   none       — keine Autorisierungspflicht, Start kommt rein aus state_mode
  auth_mode: "tag_hold"

  # Zustand-Erkennung:
  #   state_keywords   — Substring-Match gegen sensor_state (Alfen-Standard)
  #   power_threshold  — Ableitung aus power_sensor + power_threshold_w
  #   energy_delta     — Ende, wenn sensor_energy end_idle_minutes lang stillsteht
  #   external_boolean — active_entity (on/off) bestimmt Start/Ende direkt,
  #                       z.B. eine selbst gebaute HA-Template-Entity
  state_mode: "state_keywords"

  # Nur bei state_mode: "power_threshold"
  power_sensor: ""
  power_threshold_w: 100

  # Bei state_mode: "power_threshold" / "energy_delta" — wie lange (Minuten)
  # Leistung unter Schwelle bzw. Zähler unverändert sein muss, bis die
  # Session als beendet gilt (großzügig wählen wegen Lastmanagement-Pausen).
  end_idle_minutes: 5

  # Nur bei state_mode: "external_boolean"
  active_entity: ""

  # Nur bei state_mode: "state_keywords" und wallbox_profile: "custom" —
  # leer lassen übernimmt die bewährten Alfen-Keywords.
  end_keywords: []
  pause_keywords: []

  # Nur nötig, falls SUPERVISOR_TOKEN nicht verfügbar ist (Normalfall: leer lassen)
  ha_token: ""

  # ── Haftender RFID-Wert ────────────────────────────────────────────────
  # 0 = aus (Standard, Verhalten wie bisher).
  # Manche Quellen halten den letzten Tag dauerhaft — die Alfen-Integration
  # leitet ihn z.B. aus dem Transaktions-Log ab, also aus dem letzten
  # ABGESCHLOSSENEN Ladevorgang. Dann setzt das Addon den Wert nach dieser
  # Zeit selbst auf "kein Tag" zurück. 1.0 ist ein guter Startwert.
  rfid_hold_seconds: 0

  # Mindest-kWh, ab dem eine Session als echte Ladung gilt (sonst "discarded")
  min_session_kwh: 0.05

  # Sicherung: hängende Session nach so vielen Stunden zwangsweise schließen
  # (großzügig, damit normale Lastmanagement-Pausen NICHT betroffen sind)
  max_session_hours: 24

  # ── Betriebsparameter (Vorgaben = bisheriges Verhalten) ────────────────
  web_port: 8099
  web_bind: "0.0.0.0"
  ocpp_port: 9000
  ocpp_bind: "0.0.0.0"
  debounce_seconds: 7
  max_plausible_kw: 50
  max_discard_hours: 0.25
  pending_auth_window: 600
  api_timeout: 30
  api_retries: 5
  api_backoff: 0.5
  learn_ttl_seconds: 600
  learn_max_entries: 10
  trend_days: 14

  # API-Konfiguration für Dolibarr-Übertragung
  api:
    dolibarr_url: "https://dolibarr.example.com"
    api_token: "your_dolapikey_here"
    transmit_interval: 300
    timeout: 30

schema:
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  wallboxes:
    - id: "str"
      name: "str"
      enabled: "bool"
      default: "bool"
  wallbox_id: "str"
  rfid_whitelist:
    - "str"
  session_source: "list(ha_sensors|ocpp)"
  ocpp_charge_points:
    - id: "str"
      password: "password?"
      wallbox_id: "str?"
  ocpp_heartbeat_interval: "int(30,3600)"
  ocpp_apply_recommended_config: "bool"
  wallbox_profile: "list(alfen_eve|custom)"
  sensor_rfid: "str"
  sensor_energy: "str"
  sensor_state: "str"
  auth_mode: "list(tag_hold|tag_pulse|tag_toggle|none)"
  state_mode: "list(state_keywords|power_threshold|energy_delta|external_boolean)"
  power_sensor: "str"
  power_threshold_w: "float"
  end_idle_minutes: "float"
  active_entity: "str"
  end_keywords:
    - "str"
  pause_keywords:
    - "str"
  ha_token: "password"
  rfid_hold_seconds: "float(0,60)"
  min_session_kwh: "float"
  max_session_hours: "float"
  web_port: "int(1,65535)"
  web_bind: "str"
  ocpp_port: "int(1,65535)"
  ocpp_bind: "str"
  debounce_seconds: "float(1,120)"
  max_plausible_kw: "float(1,400)"
  max_discard_hours: "float(0,24)"
  pending_auth_window: "int(10,86400)"
  api_timeout: "int(5,300)"
  api_retries: "int(0,10)"
  api_backoff: "float(0,30)"
  learn_ttl_seconds: "float(30,3600)"
  learn_max_entries: "int(1,100)"
  trend_days: "int(1,90)"
  api:
    dolibarr_url: "str"
    api_token: "str"
    transmit_interval: "int"
    timeout: "int"

logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
